name: 部署 COUI 网站

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-coui-icons
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: 构建并部署 COUI 静态站点
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 安装网页生成依赖
        run: npm ci --prefix Pages

      - name: 生成图标数据文件
        run: |
          set -euo pipefail
          node Pages/generate.mjs
          test -s Pages/index.html
          test -s Pages/icons/index.html
          test -s Pages/style.css
          test -s Pages/theme.js
          test -s Pages/app.js
          test -s Pages/data.js

      - name: 清理网页生成依赖
        run: |
          node -e 'require("node:fs").rmSync("Pages/node_modules", { recursive: true, force: true })'

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: 上传静态站点产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: Pages

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
