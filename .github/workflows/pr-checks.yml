name: PR Android 检查

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Lint 与 Demo 构建
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 检查差异格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: 执行 Lint、Demo 构建与库发行构建
        run: |
          set -euo pipefail
          ./gradlew :coui:lintDebug :coui-material3:lintDebug :demo:lintRelease :demo:assembleDebug :demo:assembleRelease \
            :coui:publishAllPublicationsToLocalRepository :coui-material3:publishAllPublicationsToLocalRepository \
            --stacktrace 2>&1 | tee "$RUNNER_TEMP/coui-pr-build.log"
      - name: 检查两个库的发行文件与依赖
        run: node .github/scripts/verify-maven-artifacts.cjs
      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coui-pr-build.log
            **/build/reports/**
          retention-days: 14
