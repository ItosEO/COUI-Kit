name: 发布库预览版

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 GitHub Packages
    if: github.repository == 'ItosEO/COUI-Kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-disabled: true
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 生成预览版本
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo 'VERSION_NAME 必须为 x.y.z-SNAPSHOT' >&2
            exit 1
          fi
          commit=$(git rev-parse --short=12 HEAD)
          echo "name=${base%-SNAPSHOT}-$commit-SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "group=$(sed -n 's/^GROUP=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: 构建本地 Maven 产物
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ./gradlew :coui:publishAllPublicationsToLocalRepository :coui-material3:publishAllPublicationsToLocalRepository :coui-icons:publishAllPublicationsToLocalRepository \
            "-PVERSION_NAME=$PACKAGE_VERSION" --no-configuration-cache --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/coui-publish-build.log"
      - name: 检查发行文件与传递依赖
        env:
          PACKAGE_GROUP: ${{ steps.version.outputs.group }}
          PACKAGE_VERSION: ${{ steps.version.outputs.name }}
        run: node .github/scripts/verify-maven-artifacts.cjs
      - name: 上传到 GitHub Packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew :coui:publishAllPublicationsToGitHubPackagesRepository :coui-material3:publishAllPublicationsToGitHubPackagesRepository :coui-icons:publishAllPublicationsToGitHubPackagesRepository \
            "-PVERSION_NAME=$PACKAGE_VERSION" --no-configuration-cache --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/coui-publish-upload.log"
      - name: 确认远端版本可读取
        env:
          PACKAGE_GROUP: ${{ steps.version.outputs.group }}
          PACKAGE_VERSION: ${{ steps.version.outputs.name }}
          PACKAGE_USER: ${{ github.actor }}
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          group_path=${PACKAGE_GROUP//./\/}
          for artifact in coui coui-material3 coui-icons; do
            metadata="$RUNNER_TEMP/$artifact-published-metadata.xml"
            curl --fail --silent --show-error --retry 3 \
              --user "$PACKAGE_USER:$PACKAGE_TOKEN" \
              "https://maven.pkg.github.com/itoseo/COUI-Kit/$group_path/$artifact/$PACKAGE_VERSION/maven-metadata.xml" \
              --output "$metadata"
            grep -Fq "<version>$PACKAGE_VERSION</version>" "$metadata"
          done
      - name: 输出接入坐标
        env:
          PACKAGE_GROUP: ${{ steps.version.outputs.group }}
          PACKAGE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          {
            echo '## COUI 预览版已发布'
            echo
            echo '```kotlin'
            echo "implementation(\"$PACKAGE_GROUP:coui:$PACKAGE_VERSION\")"
            echo "implementation(\"$PACKAGE_GROUP:coui-material3:$PACKAGE_VERSION\")"
            echo "implementation(\"$PACKAGE_GROUP:coui-icons:$PACKAGE_VERSION\")"
            echo '```'
            echo
            echo "源码提交: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo
            echo "包页面: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/packages"
            echo
            echo '仓库认证与接入步骤见 docs/guide/github-packages.md。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coui-publish-build.log
            ${{ runner.temp }}/coui-publish-upload.log
            coui/build/reports/**
            coui-material3/build/reports/**
            coui-icons/build/reports/**
          retention-days: 14
