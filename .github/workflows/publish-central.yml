name: 发布 Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布三模块到 Maven Central
    if: github.repository == 'ItosEO/COUI-Kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出发行 Tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 检查版本与主线归属
        id: version
        run: |
          set -euo pipefail
          node .github/scripts/central-release-version.cjs
          git merge-base --is-ancestor HEAD origin/main || {
            echo '发行 Tag 必须指向已合入 main 的提交' >&2
            exit 1
          }
      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-disabled: true
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 构建并检查发行产物
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :coui:lintRelease :coui-material3:lintRelease :coui-icons:lintRelease \
            :coui:publishAllPublicationsToLocalRepository :coui-material3:publishAllPublicationsToLocalRepository :coui-icons:publishAllPublicationsToLocalRepository \
            "-PVERSION_NAME=$PACKAGE_VERSION" --no-configuration-cache --stacktrace
          node .github/scripts/verify-maven-artifacts.cjs
      - name: 签名并提交自动发布
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?缺少 MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?缺少 MAVEN_CENTRAL_PASSWORD}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?缺少 GPG_SIGNING_KEY}"
          ./gradlew publishAndReleaseToMavenCentral \
            "-PVERSION_NAME=$PACKAGE_VERSION" \
            -PmavenCentralPublishing=true -PsignAllPublications=true \
            -PmavenCentralDeploymentValidation=NONE --no-configuration-cache --stacktrace
          group=$(sed -n 's/^GROUP=//p' gradle.properties)
          {
            echo '## Maven Central 三模块已提交'
            echo
            echo 'Central 将继续异步校验和发布。'
            echo
            echo "版本: $PACKAGE_VERSION"
            echo "源码提交: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo
            echo '```kotlin'
            echo "implementation(\"$group:coui:$PACKAGE_VERSION\")"
            echo "implementation(\"$group:coui-material3:$PACKAGE_VERSION\")"
            echo "implementation(\"$group:coui-icons:$PACKAGE_VERSION\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
