name: 发布 COUI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的发行 Tag（例如 v0.0.1-alpha20）'
        required: true
        type: string
      target:
        description: '本次手动发布的渠道'
        required: true
        default: 'maven-central'
        type: choice
        options:
          - maven-central
          - both

permissions:
  contents: read

concurrency:
  group: publish-coui-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 校验发行 Tag
    if: github.repository == 'ItosEO/COUI-Kit'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: 检出发行 Tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 检查版本与主线归属
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$INPUT_TAG" node .github/scripts/central-release-version.cjs
            commit=$(git rev-parse --verify "refs/tags/${INPUT_TAG}^{commit}") || {
              echo "发行 Tag 不存在: $INPUT_TAG" >&2
              exit 1
            }
          else
            node .github/scripts/central-release-version.cjs
            commit=$(git rev-parse HEAD)
          fi
          git merge-base --is-ancestor "$commit" origin/main || {
            echo '发行 Tag 必须指向已合入 main 的提交' >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  jitpack:
    name: 发布三模块到 JitPack
    needs: release
    if: github.event_name == 'push' || inputs.target == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 触发构建并确认远端产物
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail
          jitpack_repo=itoseo/coui-kit
          group=com.github.${jitpack_repo/\//.}
          base="https://jitpack.io/com/github/$jitpack_repo"
          log="$base/$PACKAGE_VERSION/build.log"
          echo "JitPack 构建日志: $log"
          # 首次请求 Maven 产物会触发构建，等待期间请求可能超时。
          curl -fsSL --retry 60 --retry-delay 15 --retry-all-errors --retry-max-time 960 --max-time 60 \
            --output /dev/null "$base/coui/$PACKAGE_VERSION/coui-$PACKAGE_VERSION.pom"
          for artifact in coui coui-material3 coui-icons; do
            for extension in aar pom module; do
              url="$base/$artifact/$PACKAGE_VERSION/$artifact-$PACKAGE_VERSION.$extension"
              curl -fsSIL --retry 3 --max-time 30 --output /dev/null "$url" || {
                echo "JitPack 产物不可下载: $url" >&2
                exit 1
              }
            done
          done
          build=$(curl -fsSL --retry 3 --max-time 30 \
            "https://jitpack.io/api/builds/com.github.$jitpack_repo/$PACKAGE_VERSION")
          jq -e --arg commit "$RELEASE_COMMIT" '.status == "ok" and .commit == $commit' <<< "$build" >/dev/null || {
            echo "JitPack 构建状态或源码提交不匹配，预期提交: $RELEASE_COMMIT" >&2
            echo "$build" >&2
            exit 1
          }
          {
            echo '## JitPack 三模块已可下载'
            echo
            echo "源码提交: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$RELEASE_COMMIT"
            echo "构建日志: $log"
            echo
            echo '```kotlin'
            for artifact in coui coui-material3 coui-icons; do
              echo "implementation(\"$group:$artifact:$PACKAGE_VERSION\")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 发布三模块到 Maven Central
    needs: release
    if: (github.event_name == 'push' && needs.release.outputs.stable == 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PACKAGE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: 检出发行提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-disabled: true
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: 构建并检查发行产物
        run: |
          set -euo pipefail
          ./gradlew :coui:lintRelease :coui-material3:lintRelease :coui-icons:lintRelease \
            :coui:publishAllPublicationsToLocalRepository :coui-material3:publishAllPublicationsToLocalRepository :coui-icons:publishAllPublicationsToLocalRepository \
            "-PVERSION_NAME=$PACKAGE_VERSION" --no-configuration-cache --stacktrace
          node .github/scripts/verify-maven-artifacts.cjs
      - name: 签名并提交自动发布
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?缺少 MAVEN_CENTRAL_USERNAME}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?缺少 MAVEN_CENTRAL_PASSWORD}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?缺少 GPG_SIGNING_KEY}"
          ./gradlew publishAndReleaseToMavenCentral \
            "-PVERSION_NAME=$PACKAGE_VERSION" \
            -PmavenCentralPublishing=true -PsignAllPublications=true \
            -PmavenCentralDeploymentValidation=NONE --no-configuration-cache --stacktrace
          group=$(sed -n 's/^GROUP=//p' gradle.properties)
          {
            echo '## Maven Central 三模块已提交'
            echo
            echo 'Central 将继续异步校验和发布。'
            echo
            echo "版本: $PACKAGE_VERSION"
            echo "源码提交: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)"
            echo
            echo '```kotlin'
            echo "implementation(\"$group:coui:$PACKAGE_VERSION\")"
            echo "implementation(\"$group:coui-material3:$PACKAGE_VERSION\")"
            echo "implementation(\"$group:coui-icons:$PACKAGE_VERSION\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
