name: Demo 打包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    name: 构建固定签名 Demo
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: 准备固定测试密钥
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_ALIAS_PASSWORD" ]; then
            echo '缺少 Demo 签名 Secrets: KEYSTORE / KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEYSTORE_ALIAS_PASSWORD' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/coui-demo.jks"
      - name: 生成 Demo 版本信息
        id: version
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: 构建 release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/coui-demo.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          DEMO_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          ./gradlew :demo:assembleRelease --no-configuration-cache --stacktrace \
            "-PdemoVersionNameSuffix=-ci.$DEMO_COMMIT" \
            2>&1 | tee "$RUNNER_TEMP/coui-demo-build.log"
      - name: 验证 APK 签名与 mapping
        run: |
          set -euo pipefail
          test -s demo/build/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs demo/build/outputs/apk/release/demo-release.apk
      - name: 上传 APK 与 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coui-demo-${{ steps.version.outputs.commit }}-${{ github.run_attempt }}
          path: |
            demo/build/outputs/apk/release/*.apk
            demo/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coui-demo-build.log
            **/build/reports/**
          retention-days: 14
      - name: 清理测试密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/coui-demo.jks"
